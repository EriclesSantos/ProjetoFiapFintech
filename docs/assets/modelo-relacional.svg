<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b172a"/><stop offset="1" stop-color="#142942"/></linearGradient></defs>
<rect width="1600" height="1030" fill="url(#bg)"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="60" y="55" font-size="15" letter-spacing="3" fill="#67e8d0">SQL · ORACLE · EDUCAÇÃO FINANCEIRA</text>
<text x="60" y="105" fill="#f6f9fd" font-size="37" font-weight="700">Monk | Domínio financeiro</text>
<text x="60" y="145" fill="#a9bed4" font-size="18">Entidades da revisão didática. A interface HTML e o estudo de banco são independentes.</text><rect x="60" y="220" width="350" height="240" rx="18" fill="#162b43" stroke="#35516e"/><rect x="60" y="220" width="6" height="240" rx="3" fill="#f6cf7b"/><text x="84" y="260" font-size="23" fill="#f6cf7b" font-weight="700">usuario</text><text x="84" y="298" font-size="18" fill="#e2ebf6">PK id_usuario</text><text x="84" y="327" font-size="18" fill="#e2ebf6">nome / e-mail / senha_hash</text><text x="84" y="356" font-size="18" fill="#e2ebf6">perfil_financeiro</text><rect x="440" y="220" width="350" height="240" rx="18" fill="#162b43" stroke="#35516e"/><rect x="440" y="220" width="6" height="240" rx="3" fill="#f6cf7b"/><text x="464" y="260" font-size="23" fill="#f6cf7b" font-weight="700">conta_financeira</text><text x="464" y="298" font-size="18" fill="#e2ebf6">PK id_conta</text><text x="464" y="327" font-size="18" fill="#e2ebf6">FK id_usuario → usuario</text><text x="464" y="356" font-size="18" fill="#e2ebf6">nome / tipo / saldo_inicial</text><rect x="820" y="220" width="350" height="240" rx="18" fill="#162b43" stroke="#35516e"/><rect x="820" y="220" width="6" height="240" rx="3" fill="#f6cf7b"/><text x="844" y="260" font-size="23" fill="#f6cf7b" font-weight="700">transacao</text><text x="844" y="298" font-size="18" fill="#e2ebf6">PK id_transacao</text><text x="844" y="327" font-size="18" fill="#e2ebf6">FK id_conta → conta_financeira</text><text x="844" y="356" font-size="18" fill="#e2ebf6">tipo / categoria / valor / data</text><rect x="1200" y="220" width="350" height="240" rx="18" fill="#162b43" stroke="#35516e"/><rect x="1200" y="220" width="6" height="240" rx="3" fill="#f6cf7b"/><text x="1224" y="260" font-size="23" fill="#f6cf7b" font-weight="700">investimento</text><text x="1224" y="298" font-size="18" fill="#e2ebf6">PK id_investimento</text><text x="1224" y="327" font-size="18" fill="#e2ebf6">FK id_usuario → usuario</text><text x="1224" y="356" font-size="18" fill="#e2ebf6">tipo / valor / data_aplicacao</text><rect x="60" y="565" width="350" height="240" rx="18" fill="#162b43" stroke="#35516e"/><rect x="60" y="565" width="6" height="240" rx="3" fill="#7fd9cf"/><text x="84" y="605" font-size="23" fill="#7fd9cf" font-weight="700">definicao_meta</text><text x="84" y="643" font-size="18" fill="#e2ebf6">PK id_meta</text><text x="84" y="672" font-size="18" fill="#e2ebf6">FK id_usuario → usuario</text><text x="84" y="701" font-size="18" fill="#e2ebf6">titulo / valor_alvo / data_alvo</text><rect x="440" y="565" width="350" height="240" rx="18" fill="#162b43" stroke="#35516e"/><rect x="440" y="565" width="6" height="240" rx="3" fill="#7fd9cf"/><text x="464" y="605" font-size="23" fill="#7fd9cf" font-weight="700">alerta</text><text x="464" y="643" font-size="18" fill="#e2ebf6">PK id_alerta</text><text x="464" y="672" font-size="18" fill="#e2ebf6">FK id_usuario → usuario</text><text x="464" y="701" font-size="18" fill="#e2ebf6">mensagem / criado_em / lido</text><rect x="820" y="565" width="350" height="240" rx="18" fill="#162b43" stroke="#35516e"/><rect x="820" y="565" width="6" height="240" rx="3" fill="#7fd9cf"/><text x="844" y="605" font-size="23" fill="#7fd9cf" font-weight="700">conteudo_educativo</text><text x="844" y="643" font-size="18" fill="#e2ebf6">PK id_conteudo</text><text x="844" y="672" font-size="18" fill="#e2ebf6">titulo / tipo / nivel / url</text><text x="844" y="701" font-size="18" fill="#e2ebf6">Conteúdo independente do usuário</text><rect x="1200" y="565" width="350" height="240" rx="18" fill="#162b43" stroke="#35516e"/><rect x="1200" y="565" width="6" height="240" rx="3" fill="#7fd9cf"/><text x="1224" y="605" font-size="23" fill="#7fd9cf" font-weight="700">transacao_investimento</text><text x="1224" y="643" font-size="18" fill="#e2ebf6">PK id_transacao + id_investimento</text><text x="1224" y="672" font-size="18" fill="#e2ebf6">FK transacao / investimento</text><text x="1224" y="701" font-size="18" fill="#e2ebf6">Relacionamento N:N</text><text x="60" y="915" fill="#c4d6e8" font-size="18">Valores monetários com precisão e escala · Integridade referencial · Dados de demonstração.</text><text x="60" y="958" fill="#9fb6ce" font-size="17">PK = chave primária · FK = chave estrangeira · O acervo original e o SQL revisado estão separados.</text></g></svg>