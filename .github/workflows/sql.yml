name: SQL study checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  h2-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: mvn -B dependency:copy -Dartifact=com.h2database:h2:2.3.232 -DoutputDirectory=.ci
      - run: java -cp .ci/h2-2.3.232.jar tests/DatabaseSmokeTest.java database monk
